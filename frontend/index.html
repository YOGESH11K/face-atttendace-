<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Face Attendance — Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(1000px 500px at 85% -10%, rgba(0,214,143,0.10) 0%, transparent 60%),
                        radial-gradient(800px 500px at -10% 110%, rgba(0,184,217,0.08) 0%, transparent 55%),
                        #06130d;
            color: #c8e6d8;
            padding: 20px;
        }

        .card {
            background: rgba(0,214,143,0.05);
            border: 1px solid rgba(0,214,143,0.14);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 20px;
            padding: 40px 36px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 8px 40px rgba(0,0,0,0.3);
        }

        .logo {
            width: 50px;
            height: 50px;
            background: linear-gradient(135deg, #00d68f, #00b8d9);
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 18px;
            color: #04120b;
            margin: 0 auto 24px;
        }

        h1 {
            text-align: center;
            font-size: 24px;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 6px;
        }

        .subtitle {
            text-align: center;
            font-size: 14px;
            color: rgba(200,230,216,0.5);
            margin-bottom: 32px;
        }

        #error-flash {
            display: none;
            background: rgba(255,107,107,0.12);
            border: 1px solid rgba(255,107,107,0.25);
            color: #ff6b6b;
            border-radius: 10px;
            padding: 12px 16px;
            font-size: 13px;
            margin-bottom: 20px;
            text-align: center;
        }

        #error-flash.visible {
            display: block;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: rgba(200,230,216,0.7);
            margin-bottom: 6px;
        }

        .form-group input {
            width: 100%;
            padding: 12px 14px;
            background: rgba(0,0,0,0.25);
            border: 1px solid rgba(0,214,143,0.18);
            border-radius: 10px;
            color: #ffffff;
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        .form-group input::placeholder {
            color: rgba(200,230,216,0.3);
        }

        .form-group input:focus {
            border-color: #00d68f;
            box-shadow: 0 0 0 3px rgba(0,214,143,0.1);
        }

        .btn {
            width: 100%;
            padding: 13px 0;
            background: linear-gradient(135deg, #00d68f, #00b8d9);
            color: #04120b;
            border: none;
            border-radius: 10px;
            font-family: 'Inter', sans-serif;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.15s ease, box-shadow 0.15s ease;
            margin-top: 6px;
        }

        .btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(0,214,143,0.3);
        }

        .btn:active {
            transform: translateY(0);
        }

        .footer {
            text-align: center;
            margin-top: 24px;
            font-size: 13px;
            color: rgba(200,230,216,0.45);
        }

        .footer a {
            color: #00d68f;
            text-decoration: none;
            font-weight: 500;
            transition: color 0.2s;
        }

        .footer a:hover {
            color: #00b8d9;
        }

        .brand {
            text-align: center;
            margin-top: 20px;
            font-size: 12px;
            color: rgba(200,230,216,0.25);
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="logo">FA</div>
        <h1>Welcome Back</h1>
        <p class="subtitle">Sign in to Face Attendance System</p>

        <div id="error-flash"></div>

        <form id="login-form">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" placeholder="Enter your username" required autocomplete="username">
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Enter your password" required autocomplete="current-password">
            </div>
            <button type="submit" class="btn">Sign In</button>
        </form>

        <p class="footer">Don't have an account? <a href="register.html">Register</a></p>
        <p class="brand">Built by Yash — Face Attendance System</p>
    </div>

    <script src="config.js"></script>
    <script>
        let csrfToken = '';

        const flashEl = document.getElementById('error-flash');

        function showError(msg) {
            flashEl.textContent = msg;
            flashEl.classList.add('visible');
        }

        function hideError() {
            flashEl.classList.remove('visible');
            flashEl.textContent = '';
        }

        async function fetchCsrf() {
            try {
                const res = await fetch(API_BASE + '/api/csrf', {
                    credentials: 'include'
                });
                const data = await res.json();
                csrfToken = data.csrf_token || '';
            } catch (err) {
                showError('Unable to connect to server. Please try again later.');
            }
        }

        fetchCsrf();

        document.getElementById('login-form').addEventListener('submit', async function (e) {
            e.preventDefault();
            hideError();

            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;

            if (!username || !password) {
                showError('Please enter both username and password.');
                return;
            }

            try {
                const res = await fetch(API_BASE + '/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Accept': 'application/json',
                        'X-CSRFToken': csrfToken
                    },
                    credentials: 'include',
                    body: JSON.stringify({ username: username, password: password })
                });

                const data = await res.json();

                if (data.ok) {
                    window.location.href = 'dashboard.html';
                } else {
                    showError(data.error || data.message || 'Login failed. Please check your credentials.');
                }
            } catch (err) {
                showError('Network error. Please try again.');
            }
        });
    </script>
</body>
</html>
