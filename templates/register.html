<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Register | Face Attendance</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: #0a0e1a;
            color: #e8edf5;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        body::before {
            content: '';
            position: fixed;
            top: -40%; left: -20%;
            width: 70%; height: 80%;
            background: radial-gradient(ellipse, rgba(108,92,231,0.1) 0%, transparent 70%);
            pointer-events: none;
        }
        body::after {
            content: '';
            position: fixed;
            bottom: -30%; right: -10%;
            width: 60%; height: 70%;
            background: radial-gradient(ellipse, rgba(0,206,201,0.07) 0%, transparent 70%);
            pointer-events: none;
        }
        .auth-wrap {
            width: 100%;
            max-width: 420px;
            padding: 20px;
            position: relative;
            z-index: 1;
        }
        .auth-card {
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.06);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            padding: 40px 36px;
        }
        .logo {
            width: 50px; height: 50px;
            border-radius: 14px;
            background: linear-gradient(135deg, #6c5ce7, #a29bfe);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 20px;
            margin: 0 auto 16px;
            box-shadow: 0 4px 20px rgba(108,92,231,0.3);
        }
        h1 { text-align: center; font-size: 22px; font-weight: 700; margin-bottom: 4px; }
        .subtitle { text-align: center; color: #8892a8; font-size: 13px; margin-bottom: 28px; }
        .flash { background: rgba(255,107,107,0.12); border: 1px solid rgba(255,107,107,0.2); color: #ff6b6b; padding: 10px 16px; border-radius: 10px; font-size: 13px; margin-bottom: 16px; text-align: center; }
        .flash-success { background: rgba(0,206,201,0.12); border: 1px solid rgba(0,206,201,0.2); color: #00cec9; }
        .form-group { margin-bottom: 16px; }
        label { display: block; font-size: 12px; font-weight: 600; color: #8892a8; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px; }
        input {
            width: 100%; padding: 12px 16px;
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 10px;
            color: #e8edf5;
            font-family: inherit;
            font-size: 14px;
            outline: none;
            transition: all 0.2s;
        }
        input:focus { border-color: #6c5ce7; box-shadow: 0 0 0 3px rgba(108,92,231,0.15); }
        .btn {
            width: 100%; padding: 12px;
            border: none; border-radius: 10px;
            font-family: inherit; font-size: 15px; font-weight: 600;
            cursor: pointer; transition: all 0.2s;
            background: linear-gradient(135deg, #6c5ce7, #a29bfe);
            color: #fff;
        }
        .btn:hover { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(108,92,231,0.3); }
        .footer-text { text-align: center; margin-top: 20px; font-size: 13px; color: #8892a8; }
        .footer-text a { color: #a29bfe; text-decoration: none; font-weight: 600; }
        .footer-text a:hover { text-decoration: underline; }
        .brand { text-align: center; margin-top: 24px; font-size: 12px; color: #8892a8; }
    </style>
</head>
<body>
    <div class="auth-wrap">
        <div class="auth-card">
            <div class="logo">FA</div>
            <h1>Create Account</h1>
            <p class="subtitle">Join the Face Attendance System</p>
            {% with messages = get_flashed_messages(with_categories=true) %}
                {% for category, message in messages %}
                    <div class="flash {% if category == 'success' %}flash-success{% endif %}">{{ message }}</div>
                {% endfor %}
            {% endwith %}
            <form method="POST">
                <div class="form-group">
                    <label>Username</label>
                    <input type="text" name="username" placeholder="Choose a username" required autofocus/>
                </div>
                <div class="form-group">
                    <label>Display Name</label>
                    <input type="text" name="display_name" placeholder="Your full name (e.g. Yash)" required/>
                </div>
                <div class="form-group">
                    <label>School Name</label>
                    <input type="text" name="school" placeholder="e.g. St. Xavier's School" />
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" name="password" placeholder="Create password (min 8 chars, incl. letter & number)" required/>
                </div>
                <div class="form-group">
                    <label>Confirm Password</label>
                    <input type="password" name="confirm_password" placeholder="Confirm password" required/>
                </div>
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
                <button type="submit" class="btn">Create Account</button>
            </form>
            <p class="footer-text">Already have an account? <a href="{{ url_for('auth.login') }}">Sign In</a></p>
            <p class="brand">Built by <strong>Yash</strong> &mdash; Face Attendance System</p>
        </div>
    </div>
</body>
</html>
