<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Login | Face Attendance</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background:
                radial-gradient(1000px 500px at 85% -10%, rgba(0,214,143,0.10) 0%, transparent 60%),
                radial-gradient(800px 500px at -10% 110%, rgba(0,184,217,0.08) 0%, transparent 55%),
                #06130d;
            color: #e6f6ef;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        .auth-wrap {
            width: 100%;
            max-width: 420px;
            padding: 20px;
            position: relative;
            z-index: 1;
        }
        .auth-card {
            background: rgba(0,214,143,0.05);
            border: 1px solid rgba(0,214,143,0.14);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            padding: 40px 36px;
        }
        .logo {
            width: 50px; height: 50px;
            border-radius: 14px;
            background: linear-gradient(135deg, #00d68f, #00b8d9);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 20px;
            margin: 0 auto 16px;
            color: #04120b;
            box-shadow: 0 4px 20px rgba(0,214,143,0.3);
        }
        h1 { text-align: center; font-size: 22px; font-weight: 700; margin-bottom: 4px; }
        .subtitle { text-align: center; color: #7fa399; font-size: 13px; margin-bottom: 28px; }
        .flash { background: rgba(255,107,107,0.12); border: 1px solid rgba(255,107,107,0.25); color: #ff6b6b; padding: 10px 16px; border-radius: 10px; font-size: 13px; margin-bottom: 16px; text-align: center; }
        .flash-success { background: rgba(0,230,140,0.12); border: 1px solid rgba(0,230,140,0.25); color: #00e68c; }
        .form-group { margin-bottom: 16px; }
        label { display: block; font-size: 12px; font-weight: 600; color: #7fa399; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px; }
        input {
            width: 100%; padding: 12px 16px;
            background: rgba(0,0,0,0.25);
            border: 1px solid rgba(0,214,143,0.18);
            border-radius: 10px;
            color: #e6f6ef;
            font-family: inherit;
            font-size: 14px;
            outline: none;
            transition: all 0.2s;
        }
        input:focus { border-color: #00d68f; box-shadow: 0 0 0 3px rgba(0,214,143,0.15); }
        .btn {
            width: 100%; padding: 12px;
            border: none; border-radius: 10px;
            font-family: inherit; font-size: 15px; font-weight: 700;
            cursor: pointer; transition: all 0.2s;
            background: linear-gradient(135deg, #00d68f, #00b8d9);
            color: #04120b;
        }
        .btn:hover { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(0,214,143,0.3); }
        .footer-text { text-align: center; margin-top: 20px; font-size: 13px; color: #7fa399; }
        .footer-text a { color: #00d68f; text-decoration: none; font-weight: 600; }
        .footer-text a:hover { text-decoration: underline; }
        .brand { text-align: center; margin-top: 24px; font-size: 12px; color: #7fa399; }
    </style>
</head>
<body>
    <div class="auth-wrap">
        <div class="auth-card">
            <div class="logo">FA</div>
            <h1>Welcome Back</h1>
            <p class="subtitle">Sign in to Face Attendance System</p>
            {% with messages = get_flashed_messages(with_categories=true) %}
                {% for category, message in messages %}
                    <div class="flash {% if category == 'success' %}flash-success{% endif %}">{{ message }}</div>
                {% endfor %}
            {% endwith %}
            <form method="POST">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
                <div class="form-group">
                    <label>Username</label>
                    <input type="text" name="username" placeholder="Enter username" required autofocus/>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" name="password" placeholder="Enter password" required/>
                </div>
                <button type="submit" class="btn">Sign In</button>
            </form>
            <p class="footer-text">Don't have an account? <a href="{{ url_for('auth.register') }}">Register</a></p>
            <p class="brand">Built by <strong>Yash</strong> &mdash; Face Attendance System</p>
        </div>
    </div>
</body>
</html>
